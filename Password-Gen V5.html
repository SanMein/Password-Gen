<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password-Gen V4</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter/800.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono/700.css">
<style>
:root{
  --bg1:#f6f7fc; --bg2:#eef0f8;
  --card:#ffffff; --border:#e4e8f1; --border-strong:#cdd3e4;
  --text:#17203a; --muted:#6b7490; --soft:#f7f8fd;
  --primary:#5457d6; --primary-dark:#4346bd; --primary-soft:#ececfb;
  --green:#17a34a;
  --shadow:0 1px 2px rgba(23,32,58,.04),0 10px 30px rgba(23,32,58,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--text);
  background:
    radial-gradient(1100px 520px at 85% -10%, #e3e6fb 0%, rgba(227,230,251,0) 60%),
    radial-gradient(900px 480px at -10% 30%, #eef0fb 0%, rgba(238,240,251,0) 55%),
    linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);
  min-height:100vh;
}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:8px}

/* ---------- Header ---------- */
.topbar{
  max-width:1080px;margin:0 auto;padding:30px 20px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:14px}
.logo{
  width:48px;height:48px;border-radius:14px;flex:none;
  background:linear-gradient(135deg,#5b5ee8,#7d5bd6);
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 8px 20px rgba(91,94,232,.35);
}
.logo svg{width:24px;height:24px}
.brand h1{font-size:21px;font-weight:800;letter-spacing:-.02em}
.brand .tagline{font-size:13px;color:var(--muted);margin-top:2px}
.lang-switch{
  display:flex;background:#e6e9f4;border-radius:999px;padding:4px;gap:2px;
}
.lang-switch button{
  border:0;background:transparent;padding:7px 16px;border-radius:999px;
  font-size:13px;font-weight:600;color:var(--muted);transition:all .2s ease;
}
.lang-switch button.active{background:#fff;color:var(--text);box-shadow:0 2px 6px rgba(23,32,58,.12)}

/* ---------- Layout ---------- */
.container{max-width:1080px;margin:0 auto;padding:14px 20px 0}
.layout{display:grid;grid-template-columns:400px 1fr;gap:20px;align-items:start}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:24px;box-shadow:var(--shadow);
  animation:rise .5s ease both;
}
.card + .card{margin-top:0}
.card.result-card{animation-delay:.06s}
.history-card{margin-top:20px;animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card h2{font-size:16px;font-weight:700;letter-spacing:-.01em;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.card h2 svg{width:17px;height:17px;color:var(--primary)}

/* ---------- Form ---------- */
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:7px;letter-spacing:.01em}
.text-input{
  width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--border);
  background:var(--soft);font-size:14.5px;color:var(--text);transition:all .18s ease;
}
.text-input::placeholder{color:#a4abc2}
.text-input:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(84,87,214,.15)}

.range-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.range-head label{margin:0}
.range-badge{
  font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;
  background:var(--primary-soft);color:var(--primary);padding:3px 10px;border-radius:999px;
}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;
  background:linear-gradient(to right,var(--primary) var(--fill,25%),#e2e5f0 var(--fill,25%));
  outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;
  border:2px solid var(--primary);box-shadow:0 2px 6px rgba(23,32,58,.25);cursor:pointer;transition:transform .15s;
}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.12)}
input[type=range]::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--primary);
  box-shadow:0 2px 6px rgba(23,32,58,.25);cursor:pointer;
}
.range-scale{display:flex;justify-content:space-between;font-size:11px;color:#a4abc2;margin-top:6px}

.stepper{display:flex;align-items:center;gap:8px}
.stepper button{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--soft);
  font-size:18px;font-weight:600;color:var(--muted);transition:all .15s;line-height:1;
}
.stepper button:hover{border-color:var(--border-strong);background:#fff;color:var(--text)}
.stepper button:active{transform:scale(.94)}
.stepper-value{
  flex:1;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;
  padding:9px 0;border:1px solid var(--border);border-radius:11px;background:var(--soft);
}

.options-title{font-size:12.5px;font-weight:600;color:var(--muted);margin:20px 0 10px}
.option-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 14px;border:1px solid var(--border);border-radius:12px;background:var(--soft);
  margin-bottom:8px;transition:border-color .15s;
}
.option-row:hover{border-color:var(--border-strong)}
.option-row span{font-size:14px;font-weight:500}
.option-row code{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);
  background:#eef0f8;padding:2px 7px;border-radius:6px;margin-left:8px;
}
.switch{position:relative;display:inline-block;width:42px;height:24px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch .track{
  position:absolute;inset:0;background:#d4d8e8;border-radius:99px;transition:background .2s;
}
.switch .track::after{
  content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;
  top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25);
}
.switch input:checked + .track{background:var(--primary)}
.switch input:checked + .track::after{transform:translateX(18px)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:0;border-radius:13px;padding:13px 20px;font-size:14.5px;font-weight:600;
  transition:all .18s ease;
}
.btn svg{width:17px;height:17px}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(84,87,214,.32);width:100%}
.btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px);box-shadow:0 9px 22px rgba(84,87,214,.38)}
.btn-secondary{background:#fff;color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--border-strong);background:var(--soft)}
.btn-reset{width:100%;margin-top:10px;color:var(--muted)}

/* ---------- Result ---------- */
.result-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.result-head h2{margin:0}
.structure-toggle{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);font-weight:500}

.password-box{
  background:var(--soft);border:1px solid var(--border);border-radius:14px;
  padding:20px;min-height:96px;display:flex;align-items:center;flex-wrap:wrap;
  font-family:'JetBrains Mono',monospace;font-weight:600;
  font-size:clamp(16px,2.2vw,21px);line-height:1.9;word-break:break-all;
}
.password-box.flash{animation:popIn .35s ease}
@keyframes popIn{from{opacity:.25;transform:translateY(5px)}to{opacity:1;transform:none}}
.seg{padding:2px 7px;border-radius:8px}
.seg-site{background:#e3ecff;color:#1d50c8}
.seg-name{background:#f1e9ff;color:#6d33d8}
.seg-random{background:#e9edf5;color:#202b4d}
.seg-version{background:#fdeed2;color:#9c5c08}
.seg-dash{color:#a3abc4;padding:0 2px}

.result-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
.chip{
  font-size:12px;font-weight:600;color:var(--muted);background:#eef1f9;
  padding:4px 11px;border-radius:999px;
}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px}
.legend-item{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:3px;flex:none}
.dot-site{background:#2e63e8}.dot-name{background:#8a52f0}
.dot-random{background:#55618a}.dot-version{background:#d98a1c}

.strength-block{margin-top:18px}
.strength-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.strength-row .lbl{font-size:13px;font-weight:600;color:var(--muted)}
.strength-row .val{font-size:14px;font-weight:700;transition:color .3s}
.strength-bar{height:8px;background:#e7eaf3;border-radius:99px;overflow:hidden}
.strength-fill{height:100%;width:0;border-radius:99px;transition:width .55s cubic-bezier(.22,1,.36,1),background .3s}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat{background:var(--soft);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.stat-label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.stat-value{font-size:15px;font-weight:700;font-family:'JetBrains Mono',monospace}

.actions{display:flex;gap:10px;margin-top:18px}
.btn-copy{flex:1.4;position:relative}
.btn-copy .ic-check{display:none}
.btn-copy.is-copied{background:var(--green);box-shadow:0 6px 16px rgba(23,163,74,.35)}
.btn-copy.is-copied .ic-copy{display:none}
.btn-copy.is-copied .ic-check{display:inline}
.btn-regen{flex:1}

/* ---------- History ---------- */
.history-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.history-head h2{margin:0}
.btn-small{
  display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);
  background:transparent;border:1px solid var(--border);border-radius:10px;padding:7px 13px;transition:all .15s;
}
.btn-small svg{width:14px;height:14px}
.btn-small:hover{color:#d23c3c;border-color:#f1c6c6;background:#fdf4f4}
.history-list{display:flex;flex-direction:column;gap:9px}
.history-item{
  display:flex;align-items:center;gap:12px;padding:11px 14px;
  border:1px solid var(--border);border-radius:12px;background:var(--soft);
  cursor:pointer;transition:all .16s ease;
}
.history-item:hover{background:#fff;border-color:var(--border-strong);transform:translateX(2px)}
.history-pass{
  flex:1;font-family:'JetBrains Mono',monospace;font-size:13.5px;font-weight:500;color:#2a3350;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.history-time{font-size:12px;color:#a4abc2;flex:none}
.icon-btn{
  width:34px;height:34px;flex:none;display:inline-flex;align-items:center;justify-content:center;
  border:0;border-radius:9px;background:transparent;color:var(--muted);transition:all .15s;
}
.icon-btn svg{width:16px;height:16px}
.icon-btn:hover{background:var(--primary-soft);color:var(--primary)}
.history-empty{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  border:1.5px dashed var(--border-strong);border-radius:14px;padding:34px 20px;
  color:#a4abc2;font-size:14px;text-align:center;
}
.history-empty svg{width:26px;height:26px}

/* ---------- Footer / toast ---------- */
.footer{
  max-width:1080px;margin:26px auto 44px;padding:0 20px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:12.5px;color:#9aa1b8;text-align:center;
}
.footer svg{width:14px;height:14px;flex:none}
.toast{
  position:fixed;left:50%;bottom:28px;z-index:60;
  transform:translateX(-50%) translateY(20px);
  background:#1c2440;color:#fff;padding:12px 18px;border-radius:12px;
  display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500;
  opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.22,1,.36,1);
  box-shadow:0 14px 34px rgba(15,23,42,.35);
}
.toast svg{width:16px;height:16px;color:#4ade80;flex:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:920px){
  .layout{grid-template-columns:1fr}
}
@media (max-width:560px){
  .card{padding:19px}
  .actions{flex-direction:column}
  .stats{grid-template-columns:1fr}
  .topbar{padding-top:22px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777Zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
    </div>
    <div>
      <h1>Password-Gen V4</h1>
      <p class="tagline" data-i18n="tagline"></p>
    </div>
  </div>
  <div class="lang-switch" role="group" aria-label="Language">
    <button type="button" data-lang-btn="ru">RU</button>
    <button type="button" data-lang-btn="en">EN</button>
  </div>
</header>

<main class="container">
  <div class="layout">

    <!-- Параметры -->
    <section class="card">
      <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg><span data-i18n="params"></span></h2>

      <div class="field">
        <label for="projectIndex" data-i18n="indexLabel"></label>
        <input type="text" id="projectIndex" class="text-input" maxlength="30" data-i18n-ph="indexPh" autocomplete="off">
      </div>
      <div class="field">
        <label for="projectName" data-i18n="nameLabel"></label>
        <input type="text" id="projectName" class="text-input" maxlength="30" data-i18n-ph="namePh" autocomplete="off">
      </div>

      <div class="field">
        <div class="range-head">
          <label for="lengthRange" data-i18n="lengthLabel"></label>
          <span class="range-badge" id="lengthOutput">12</span>
        </div>
        <input type="range" id="lengthRange" min="5" max="25" value="12" step="1">
        <div class="range-scale"><span>5</span><span>15</span><span>25</span></div>
      </div>

      <div class="field">
        <label data-i18n="versionLabel"></label>
        <div class="stepper">
          <button type="button" id="versionDec" aria-label="-">−</button>
          <div class="stepper-value" id="versionVal">1</div>
          <button type="button" id="versionInc" aria-label="+">+</button>
        </div>
      </div>

      <div class="options-title" data-i18n="charset"></div>
      <div class="option-row">
        <span data-i18n="optUpper"></span>
        <label class="switch"><input type="checkbox" id="optUpper" checked><span class="track"></span></label>
      </div>
      <div class="option-row">
        <span data-i18n="optDigits"></span>
        <label class="switch"><input type="checkbox" id="optDigits" checked><span class="track"></span></label>
      </div>
      <div class="option-row">
        <span><span data-i18n="optSymbols"></span><code>!@#$%^&amp;*…</code></span>
        <label class="switch"><input type="checkbox" id="optSymbols" checked><span class="track"></span></label>
      </div>

      <button type="button" class="btn btn-primary" id="generateBtn" style="margin-top:18px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777Zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
        <span data-i18n="generate"></span>
      </button>
      <button type="button" class="btn btn-secondary btn-reset" id="resetBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        <span data-i18n="reset"></span>
      </button>
    </section>

    <!-- Результат -->
    <section class="card result-card">
      <div class="result-head">
        <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span data-i18n="resultTitle"></span></h2>
        <label class="structure-toggle">
          <span data-i18n="structure"></span>
          <span class="switch"><input type="checkbox" id="structureSwitch" checked><span class="track"></span></span>
        </label>
      </div>

      <div class="password-box" id="passwordBox" aria-live="polite"></div>

      <div class="result-meta">
        <span class="chip" id="charCount"></span>
      </div>
      <div class="legend" id="legend"></div>

      <div class="strength-block">
        <div class="strength-row">
          <span class="lbl" data-i18n="strength"></span>
          <span class="val" id="strengthLabel">—</span>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat-label" data-i18n="entropy"></span>
          <span class="stat-value" id="statEntropy">—</span>
        </div>
        <div class="stat">
          <span class="stat-label" data-i18n="crackTime"></span>
          <span class="stat-value" id="statCrack">—</span>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-primary btn-copy" id="copyBtn">
          <svg class="ic-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <svg class="ic-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          <span id="copyLabel"></span>
        </button>
        <button type="button" class="btn btn-secondary btn-regen" id="regenBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          <span data-i18n="regenerate"></span>
        </button>
      </div>
    </section>
  </div>

  <!-- История -->
  <section class="card history-card">
    <div class="history-head">
      <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span data-i18n="history"></span></h2>
      <button type="button" class="btn-small" id="clearHistoryBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        <span data-i18n="clear"></span>
      </button>
    </div>
    <div class="history-list" id="historyList"></div>
    <div class="history-empty" id="historyEmpty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span data-i18n="historyEmpty"></span>
    </div>
  </section>
</main>

<footer class="footer">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  <span data-i18n="footer"></span>
</footer>

<div class="toast" id="toast" role="status">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="toastMsg"></span>
</div>

<script>
(function(){
'use strict';

/* ================= i18n ================= */
const I18N = {
  ru: {
    tagline:"Надёжные пароли по вашим правилам",
    params:"Параметры",
    resultTitle:"Сгенерированный пароль",
    indexLabel:"Индекс проекта",
    indexPh:"Например: GITHUB",
    nameLabel:"Название проекта",
    namePh:"Например: Mail",
    lengthLabel:"Длина случайной части (5–25)",
    versionLabel:"Версия пароля",
    charset:"Набор символов",
    optUpper:"Заглавные буквы",
    optDigits:"Цифры",
    optSymbols:"Спецсимволы",
    generate:"Сгенерировать пароль",
    regenerate:"Перегенерировать",
    reset:"Сбросить параметры",
    copy:"Копировать",
    copied:"Скопировано!",
    structure:"Структура",
    chars:"симв.",
    strength:"Надёжность",
    entropy:"Энтропия",
    bits:"бит",
    crackTime:"Время подбора",
    strengthLevels:["Слабый","Средний","Сильный","Очень сильный"],
    legend:{site:"Индекс (leet)", name:"Название (leet)", random:"Случайная часть", version:"Версия"},
    history:"История",
    historyEmpty:"История пуста — сгенерируйте первый пароль",
    clear:"Очистить",
    toastCopied:"Пароль скопирован в буфер обмена",
    restored:"Пароль восстановлен из истории",
    footer:"Все вычисления выполняются локально в вашем браузере.",
    crackInstant:"мгновенно",
    crackThousands:"тысячи лет",
    crackMillions:"миллионы лет",
    crackEternity:"практически вечность",
    units:{sec:["секунда","секунды","секунд"], min:["минута","минуты","минут"], hour:["час","часа","часов"], day:["день","дня","дней"], year:["год","года","лет"]}
  },
  en: {
    tagline:"Strong passwords on your terms",
    params:"Parameters",
    resultTitle:"Generated password",
    indexLabel:"Project index",
    indexPh:"e.g. GITHUB",
    nameLabel:"Project name",
    namePh:"e.g. Mail",
    lengthLabel:"Random part length (5–25)",
    versionLabel:"Password version",
    charset:"Character set",
    optUpper:"Uppercase letters",
    optDigits:"Digits",
    optSymbols:"Special characters",
    generate:"Generate password",
    regenerate:"Regenerate",
    reset:"Reset parameters",
    copy:"Copy",
    copied:"Copied!",
    structure:"Structure",
    chars:"chars",
    strength:"Strength",
    entropy:"Entropy",
    bits:"bits",
    crackTime:"Time to crack",
    strengthLevels:["Weak","Medium","Strong","Very strong"],
    legend:{site:"Index (leet)", name:"Name (leet)", random:"Random part", version:"Version"},
    history:"History",
    historyEmpty:"History is empty — generate your first password",
    clear:"Clear",
    toastCopied:"Password copied to clipboard",
    restored:"Password restored from history",
    footer:"All computations run locally in your browser. Passwords are never sent or stored on any server.",
    crackInstant:"instantly",
    crackThousands:"thousands of years",
    crackMillions:"millions of years",
    crackEternity:"practically forever",
    units:{sec:["second","seconds"], min:["minute","minutes"], hour:["hour","hours"], day:["day","days"], year:["year","years"]}
  }
};

/* ================= Состояние ================= */
const state = {
  lang:"ru",
  length:12,
  version:1,
  showStructure:true,
  current:null,
  history:[]
};

/* ================= Константы генератора ================= */
const LOWER  = "abcdefghijklmnopqrstuvwxyz";
const UPPER  = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const DIGITS = "0123456789";
const SYMBOLS = "!@#$%^&*()-_=+[]{};:,.<>?";
const LEET = {A:"4", S:"$", E:"3", O:"0", I:"1", T:"7"};
const LEVEL_COLORS = ["#e5484d","#e8930c","#22a06b","#0d9488"];

/* ================= DOM ================= */
const $ = id => document.getElementById(id);
const elIndex = $("projectIndex"), elName = $("projectName");
const elLengthRange = $("lengthRange"), elLengthOutput = $("lengthOutput");
const elVersionVal = $("versionVal");
const elUpper = $("optUpper"), elDigits = $("optDigits"), elSymbols = $("optSymbols");
const elPasswordBox = $("passwordBox"), elCharCount = $("charCount"), elLegend = $("legend");
const elStrengthFill = $("strengthFill"), elStrengthLabel = $("strengthLabel");
const elStatEntropy = $("statEntropy"), elStatCrack = $("statCrack");
const elCopyBtn = $("copyBtn"), elCopyLabel = $("copyLabel");
const elHistoryList = $("historyList"), elHistoryEmpty = $("historyEmpty");
const elToast = $("toast"), elToastMsg = $("toastMsg");

/* ================= Утилиты ================= */
function t(key){
  const v = I18N[state.lang][key];
  return v === undefined ? key : v;
}
function leet(s){
  return s.toUpperCase().split("").map(c => LEET[c] || c).join("");
}
function randIntBelow(max){
  const buf = new Uint32Array(1);
  const limit = Math.floor(4294967296 / max) * max;
  let x;
  do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
  return x % max;
}
function secureShuffle(arr){
  for (let i = arr.length - 1; i > 0; i--){
    const j = randIntBelow(i + 1);
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}
function pluralIdx(n, lang){
  if (lang === "ru"){
    const a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return 0;
    if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return 1;
    return 2;
  }
  return n === 1 ? 0 : 1;
}
function unitStr(n, key){
  const arr = t("units")[key];
  return n + " " + arr[pluralIdx(n, state.lang)];
}
function crackLabel(bits){
  // Перебор со скоростью 10 млрд вариантов/с, в среднем половина пространства
  const log10s = bits * Math.LOG10_2 - Math.log10(2) - 10;
  if (log10s < 0.4) return t("crackInstant");
  const s = Math.pow(10, log10s);
  if (s < 60)        return unitStr(Math.round(s), "sec");
  if (s < 3600)      return unitStr(Math.round(s / 60), "min");
  if (s < 86400)     return unitStr(Math.round(s / 3600), "hour");
  if (s < 31557600)  return unitStr(Math.round(s / 86400), "day");
  const yrs = s / 31557600;
  if (yrs < 1000) return unitStr(Math.round(yrs), "year");
  if (yrs < 1e6)  return t("crackThousands");
  if (yrs < 1e9)  return t("crackMillions");
  return t("crackEternity");
}
function timeStr(ts){
  return new Date(ts).toLocaleTimeString(state.lang === "ru" ? "ru-RU" : "en-US", {hour:"2-digit", minute:"2-digit"});
}

/* ================= Генерация ================= */
function generate(){
  const indexVal = elIndex.value.trim();
  const nameVal  = elName.value.trim();

  let chars = LOWER;
  if (elUpper.checked)   chars += UPPER;
  if (elDigits.checked)  chars += DIGITS;
  if (elSymbols.checked) chars += SYMBOLS;

  const parts = [];
  if (indexVal) parts.push({type:"site", value: leet(indexVal).slice(0,4)});
  if (nameVal)  parts.push({type:"name", value: leet(nameVal).slice(0,4)});

  let rnd = "";
  for (let i = 0; i < state.length; i++) rnd += chars[randIntBelow(chars.length)];
  parts.push({type:"random", value: rnd});

  parts.push({type:"version", value:"V" + state.version});

  secureShuffle(parts);

  const password = parts.map(p => p.value).join("-");
  const bits = Math.round(state.length * Math.log2(chars.length));

  state.current = {password, parts, bits, ts: Date.now()};
  state.history.unshift(state.current);
  if (state.history.length > 10) state.history.pop();

  renderResult(true);
  renderHistory();
}

/* ================= Рендер ================= */
function renderResult(flash){
  const cur = state.current;
  if (!cur) return;

  elPasswordBox.innerHTML = "";
  if (state.showStructure){
    cur.parts.forEach((p, i) => {
      if (i > 0){
        const dash = document.createElement("span");
        dash.className = "seg-dash";
        dash.textContent = "-";
        elPasswordBox.appendChild(dash);
      }
      const seg = document.createElement("span");
      seg.className = "seg seg-" + p.type;
      seg.textContent = p.value;
      elPasswordBox.appendChild(seg);
    });
  } else {
    elPasswordBox.textContent = cur.password;
  }
  if (flash){
    elPasswordBox.classList.remove("flash");
    void elPasswordBox.offsetWidth;
    elPasswordBox.classList.add("flash");
  }

  elCharCount.textContent = cur.password.length + " " + t("chars");

  elLegend.innerHTML = "";
  if (state.showStructure){
    const seen = new Set();
    cur.parts.forEach(p => {
      if (seen.has(p.type)) return;
      seen.add(p.type);
      const item = document.createElement("span");
      item.className = "legend-item";
      const dot = document.createElement("span");
      dot.className = "dot dot-" + p.type;
      item.appendChild(dot);
      item.appendChild(document.createTextNode(" " + t("legend")[p.type]));
      elLegend.appendChild(item);
    });
  }

  const lvl = cur.bits < 45 ? 0 : cur.bits < 65 ? 1 : cur.bits < 85 ? 2 : 3;
  elStrengthFill.style.width = Math.min(100, cur.bits) + "%";
  elStrengthFill.style.background = LEVEL_COLORS[lvl];
  elStrengthLabel.textContent = t("strengthLevels")[lvl];
  elStrengthLabel.style.color = LEVEL_COLORS[lvl];
  elStatEntropy.textContent = "≈ " + cur.bits + " " + t("bits");
  elStatCrack.textContent = crackLabel(cur.bits);

  elCopyLabel.textContent = elCopyBtn.classList.contains("is-copied") ? t("copied") : t("copy");
}

const COPY_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

function renderHistory(){
  elHistoryList.innerHTML = "";
  if (state.history.length === 0){
    elHistoryEmpty.style.display = "flex";
    $("clearHistoryBtn").style.display = "none";
    return;
  }
  elHistoryEmpty.style.display = "none";
  $("clearHistoryBtn").style.display = "inline-flex";

  state.history.forEach(h => {
    const item = document.createElement("div");
    item.className = "history-item";

    const pass = document.createElement("span");
    pass.className = "history-pass";
    pass.textContent = h.password;

    const badge = document.createElement("span");
    badge.className = "chip";
    badge.textContent = h.password.length + " " + t("chars");

    const time = document.createElement("span");
    time.className = "history-time";
    time.textContent = timeStr(h.ts);

    const copyIc = document.createElement("button");
    copyIc.type = "button";
    copyIc.className = "icon-btn";
    copyIc.title = t("copy");
    copyIc.innerHTML = COPY_SVG;
    copyIc.addEventListener("click", async e => {
      e.stopPropagation();
      await copyText(h.password);
      showToast(t("toastCopied"));
    });

    item.appendChild(pass);
    item.appendChild(badge);
    item.appendChild(time);
    item.appendChild(copyIc);

    item.addEventListener("click", () => {
      state.current = {password: h.password, parts: h.parts, bits: h.bits, ts: h.ts};
      renderResult(true);
      showToast(t("restored"));
    });

    elHistoryList.appendChild(item);
  });
}

/* ================= Буфер обмена / toast ================= */
async function copyText(txt){
  try {
    await navigator.clipboard.writeText(txt);
    return true;
  } catch (e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = txt;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      return true;
    } catch (e2) { return false; }
  }
}
let toastTimer = null;
function showToast(msg){
  elToastMsg.textContent = msg;
  elToast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => elToast.classList.remove("show"), 2200);
}

/* ================= Язык ================= */
function applyLang(){
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.getAttribute("data-i18n"));
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => {
    el.placeholder = t(el.getAttribute("data-i18n-ph"));
  });
  document.querySelectorAll("[data-lang-btn]").forEach(b => {
    b.classList.toggle("active", b.dataset.langBtn === state.lang);
  });
  renderResult(false);
  renderHistory();
}

/* ================= Слайдер / степпер ================= */
function updateSliderFill(){
  const el = elLengthRange;
  const pct = (el.value - el.min) / (el.max - el.min) * 100;
  el.style.setProperty("--fill", pct + "%");
  elLengthOutput.textContent = el.value;
}

/* ================= События ================= */
document.querySelectorAll("[data-lang-btn]").forEach(b => {
  b.addEventListener("click", () => { state.lang = b.dataset.langBtn; applyLang(); });
});

elLengthRange.addEventListener("input", () => {
  state.length = +elLengthRange.value;
  updateSliderFill();
});

$("versionDec").addEventListener("click", () => {
  state.version = Math.max(0, state.version - 1);
  elVersionVal.textContent = state.version;
});
$("versionInc").addEventListener("click", () => {
  state.version = Math.min(999, state.version + 1);
  elVersionVal.textContent = state.version;
});

$("generateBtn").addEventListener("click", generate);
$("regenBtn").addEventListener("click", generate);

$("resetBtn").addEventListener("click", () => {
  elIndex.value = "";
  elName.value = "";
  elLengthRange.value = 12;
  state.length = 12;
  state.version = 1;
  elUpper.checked = elDigits.checked = elSymbols.checked = true;
  elVersionVal.textContent = 1;
  updateSliderFill();
  generate();
});

$("structureSwitch").addEventListener("change", e => {
  state.showStructure = e.target.checked;
  renderResult(false);
});

[elIndex, elName].forEach(inp => {
  inp.addEventListener("keydown", e => { if (e.key === "Enter") generate(); });
});

let copyResetTimer = null;
elCopyBtn.addEventListener("click", async () => {
  if (!state.current) return;
  await copyText(state.current.password);
  showToast(t("toastCopied"));
  elCopyBtn.classList.add("is-copied");
  elCopyLabel.textContent = t("copied");
  clearTimeout(copyResetTimer);
  copyResetTimer = setTimeout(() => {
    elCopyBtn.classList.remove("is-copied");
    elCopyLabel.textContent = t("copy");
  }, 1700);
});

$("clearHistoryBtn").addEventListener("click", () => {
  state.history = [];
  renderHistory();
});

/* ================= Инициализация ================= */
updateSliderFill();
applyLang();
generate();

})();
</script>
</body>
